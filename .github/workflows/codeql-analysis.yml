# .github/workflows/codeql-analysis.yml in an API repo (e.g. alloy.api)
name: CodeQL

# Keep the repo's existing `on:` block as-is when migrating (trigger clean-up is deferred).
on:
  push:
    branches: [main]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [main]
  schedule:
    - cron: "0 5 * * 5"

permissions: {}

jobs:
  codeql:
    uses: sei-jbooz/Crucible-Github-Actions/.github/workflows/codeql.yaml@feat/shared-codeql
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      languages: csharp
